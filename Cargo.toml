[package]
name = "cacaofacturador-ec"
version = "1.0.0"
edition = "2024"
authors = ["Cacao Apps"]
description = "Facturador Electrónico SRI Ecuador e Inventario con Rust, SQLite (SQLx) y Tauri v2"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
uuid = { version = "1.15", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.3", features = [] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
dirs = "6.0"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
