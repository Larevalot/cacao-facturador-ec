name: "Release Build"

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: cacaofacturador-ec
            asset_name: cacao-facturador-ec-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: cacaofacturador-ec.exe
            asset_name: cacao-facturador-ec-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev libfreetype6-dev libasound2-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}

      - name: Upload artifact to job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Cacao Facturador ${{ github.ref_name }}'
          body: |
            ## 🍫 Cacao Facturador SRI ${{ github.ref_name }}

            ### Novedades:
            - Interfaz de escritorio nativa en Rust e Iced GUI.
            - Soporte completo para 3 plantillas RIDE en PDF (Clásica, Moderna y Compacta) con logotipo corporativo.
            - Facturación electrónica con esquema offline SRI (v2.1 / v2.34), firma digital XAdES-BES y validación de módulo 11.
            - Auto-descarte de notificaciones flotantes tras 6 segundos.
            - Almacenamiento local seguro en SQLite (`~/.cacaofacturador/`).

            ### Binarios disponibles:
            - **Linux (x86_64)**: `cacao-facturador-ec-linux-x86_64.tar.gz`
            - **Windows (x86_64)**: `cacao-facturador-ec-windows-x86_64.zip`
          files: release-assets/*
          draft: false
          prerelease: false
